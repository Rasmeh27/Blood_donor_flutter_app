services:
  mysql:
    image: mysql:8.4
    container_name: validei-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: validei_db
      MYSQL_USER: validei_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10

  # Solo desarrollo: servidor SMTP local que captura los correos (bandeja web en http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: validei-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql_data: