# La conexión a MySQL la aporta Testcontainers (@ServiceConnection)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Clave exclusiva de pruebas (no se usa fuera de los tests)
app.jwt.secret-base64=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLXZhbGlkZWktaW50ZWdyYXRpb24tdGVzdHM=
app.jwt.issuer=validei-api
app.jwt.expiration-minutes=60

server.error.include-stacktrace=never
server.error.include-exception=false

# El envío real se sustituye en las pruebas por un JavaMailSender simulado
spring.mail.host=localhost
spring.mail.port=1025
# Sin espera entre solicitudes para poder encadenar códigos; el límite horario se prueba con 3
app.password-reset.request-cooldown-seconds=0
app.password-reset.max-requests-per-hour=3

# Fotos de prueba en un directorio temporal
app.storage.donor-photos-dir=${java.io.tmpdir}/validei-test-photos
