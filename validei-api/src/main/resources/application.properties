spring.application.name=validei-api

server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# DevTools activa este log por defecto e incluye los valores rechazados (por ejemplo, contraseñas inválidas).
# GlobalExceptionHandler ya construye las respuestas; no se registran los datos enviados por el cliente.
spring.mvc.log-resolved-exception=false

# Recuperación de contraseña
app.password-reset.code-ttl-minutes=10
app.password-reset.max-attempts=5
app.password-reset.request-cooldown-seconds=60
app.password-reset.max-requests-per-hour=5
app.mail.from=no-reply@validei.local

# Fotos de donantes: disco local (sin servicios externos), máximo 2 MB por imagen
app.storage.donor-photos-dir=${DONOR_PHOTOS_DIR:uploads/donor-photos}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
