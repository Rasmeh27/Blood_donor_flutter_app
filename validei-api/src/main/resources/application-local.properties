# Secretos locales (archivo .env no versionado). Las variables de entorno tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/validei_db
spring.datasource.username=${DB_USERNAME:validei_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# JWT
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=validei-api
app.jwt.expiration-minutes=60

# Evitar exponer trazas internas en respuestas HTTP
server.error.include-stacktrace=never
server.error.include-exception=false

# Correo: Mailpit local (compose.yaml). Bandeja web: http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
